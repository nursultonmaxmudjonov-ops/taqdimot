<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZAR — Dashboard</title>
<style>
  :root{
    --gold-1:#F7CB63;
    --gold-2:#E7A93A;
    --gold-3:#C9861F;
    --ink:#05060a;
    --bg-deep:#0a0b13;
    --bg-mid:#12141f;
    --panel:#171a26;
    --panel-2:#1d2130;
    --line:#282c3d;
    --text:#F2F1EC;
    --text-dim:#8d90a3;
    --teal-1:#0d3b3a;
    --teal-2:#062120;
    --teal-glow:#37e0c9;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background:#0a0b13;
    color:var(--text);
    display:flex;
    min-height:100vh;
  }

  /* Sidebar (Yon panel) */
  .sidebar{
    width:240px;
    background:#0c111c;
    border-right:1px solid var(--line);
    padding:24px 18px;
    display:flex;
    flex-direction:column;
    flex-shrink: 0;
  }
  .brand{
    color:var(--gold-1);
    font-size:24px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:32px;
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
  }
  .nav-menu{
    display:flex;
    flex-direction:column;
    gap:8px;
    list-style:none;
  }
  .nav-item a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:12px;
    color:var(--text-dim);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:0.2s;
  }
  .nav-item.active a, .nav-item a:hover{
    background:var(--panel);
    color:var(--gold-1);
  }

  /* Asosiy kontent sohasi */
  .main-wrapper{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .header{
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0c111c;
  }
  .page-title{
    font-size:20px;
    font-weight:700;
  }
  .content-body{
    padding:32px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  /* Karta va panellar */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
  }
  .balance-card{
    background:linear-gradient(135deg, #171a26 0%, #0d111d 100%);
    border:1px solid var(--gold-3);
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="brand">✨ ZAR</a>
    <ul class="nav-menu">
      <li class="nav-item active">
        <a href="index.html"><span>🏠</span> Asosiy</a>
      </li>
      <li class="nav-item">
        <a href="qidiruv.html"><span>🔍</span> Qidiruv</a>
      </li>
      <li class="nav-item">
        <a href="hamyon.html"><span>💼</span> Hamyon</a>
      </li>
      <li class="nav-item">
        <a href="profil.html"><span>👤</span> Profil</a>
      </li>
      <li class="nav-item">
        <a href="sozlamalar.html"><span>⚙️</span> Sozlamalar</a>
      </li>
    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="header">
      <h1 class="page-title">Bosh sahifa</h1>
      <div>
        <a href="profil.html" style="color:var(--gold-1); text-decoration:none; font-weight:600;">Profilim</a>
      </div>
    </header>

    <main class="content-body">
      <div class="card balance-card">
        <p style="color:var(--text-dim); font-size:14px;">Umumiy Balans</p>
        <h2 style="font-size:32px; color:var(--gold-1); margin:8px 0;">12 450 000 UZS</h2>
        <div style="display:flex; gap:12px; margin-top:16px;">
          <a href="hamyon.html" style="background:var(--gold-2); color:#000; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:700;">Hamyonga o'tish</a>
        </div>
      </div>

      <div class="card">
        <h3>So'nggi faolliklar</h3>
        <p style="color:var(--text-dim); margin-top:10px; font-size:14px;">Platforma muvaffaqiyatli ishlamoqda.</p>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
