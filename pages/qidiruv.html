<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAR — Qidiruv</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0d12',
          sidebar: '#0d1119',
          panel: '#12161f',
          card: '#141a24',
          border: '#232936',
          gold: '#e8b64a',
          golddim: '#a9812f',
          txt: '#eef0f3',
          txtdim: '#8b93a1',
          txtfaint: '#5b6472'
        }
      }
    }
  }
</script>
<style>
  ::placeholder{ color:#5b6472; }
  .card-thumb{ aspect-ratio: 9/16; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
</style>
</head>
<body class="bg-bg text-txt font-sans min-h-screen flex">

<aside class="w-[260px] min-w-[260px] bg-sidebar border-r border-border flex flex-col p-7 sticky top-0 h-screen">
  <div>
    <div class="text-2xl font-extrabold tracking-[4px] text-gold" style="font-family:Georgia, serif">ZAR</div>
    <div class="text-[10px] tracking-[2px] text-txtfaint uppercase mt-1">Private member</div>
  </div>

  <nav class="mt-9 flex flex-col gap-1">
    <!-- Asosiy endi aktiv emas -->
    <a class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-txtdim text-sm hover:bg-[#151b26] hover:text-txt transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Asosiy
    </a>
    
    <!-- QIDIRUV (Aktiv holatga o'tkazildi) -->
    <a class="relative flex items-center gap-3 px-3.5 py-2.5 rounded-lg bg-[#171d29] text-gold text-sm font-semibold">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Qidiruv
      <span class="absolute -right-7 top-0 bottom-0 w-[3px] bg-gold rounded"></span>
    </a>

    <a class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-txtdim text-sm hover:bg-[#151b26] hover:text-txt transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V13M12 19V5M20 19v-7"/></svg>
      Reytinglar
    </a>
    <a class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-txtdim text-sm hover:bg-[#151b26] hover:text-txt transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Bildirishnoma
    </a>
    <a class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-txtdim text-sm hover:bg-[#151b26] hover:text-txt transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Profil
    </a>
    <a class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-txtdim text-sm hover:bg-[#151b26] hover:text-txt transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Sozlamalar
    </a>
  </nav>

  <div class="flex-1"></div>

  <div class="bg-panel border border-border rounded-xl p-4">
    <div class="text-xs text-txtdim mb-1.5">Hisobingiz</div>
    <div class="text-xl font-bold">12 480 <span class="text-sm font-normal text-txtdim">ball</span></div>
  </div>
</aside>

<main class="flex-1 px-5 md:px-9 py-7 pb-16 min-w-0">
  <div>
    <h1 class="text-xl font-bold">Qidiruv</h1>
    <p class="text-txtdim text-sm mt-1">Videolar, foydalanuvchilar va hashtaglar bo'yicha qidiring</p>
  </div>

  <div class="mt-5 flex items-center gap-2.5 bg-panel border border-border rounded-xl px-4 py-3 max-w-xl">
    <svg class="w-[18px] h-[18px] text-txtfaint flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="text" placeholder="Foydalanuvchi, hashtag yoki so'z kiriting..." autocomplete="off"
      class="flex-1 bg-transparent border-none outline-none text-txt text-sm placeholder:text-txtfaint">
    <button id="clearBtn" class="hidden text-txtfaint text-xs hover:text-txt">Tozalash</button>
    <button id="micBtn" type="button" class="flex items-center justify-center w-8 h-8 rounded-lg text-txtdim hover:text-gold hover:bg-[#1b2230] transition flex-shrink-0" aria-label="Ovoz bilan qidirish">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 11a7 7 0 0 1-14 0"/>
        <path d="M12 19v3"/>
      </svg>
    </button>
  </div>
  <div id="micStatus" class="hidden mt-2 text-xs text-gold flex items-center gap-2 max-w-xl">
    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
    Tinglanmoqda...
  </div>

  <div id="chipRow" class="mt-4 flex gap-2 flex-wrap"></div>

  <div class="mt-5 flex justify-between items-center text-txtdim text-sm">
    <div><b id="resultCount" class="text-txt font-semibold">0</b> ta natija topildi</div>
    <div>Trend bo'yicha</div>
  </div>

  <div id="grid" class="mt-3.5 grid gap-4" style="grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));"></div>

  <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-txtdim text-center">
    <svg class="w-10 h-10 text-txtfaint mb-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <h3 class="text-base text-txt mb-1.5 font-semibold">Hech narsa topilmadi</h3>
    <div class="text-sm">Boshqa so'z yoki hashtag bilan qayta urinib ko'ring</div>
  </div>

  <button id="loadMoreBtn" class="block mx-auto mt-6 px-7 py-2.5 rounded-lg bg-panel border border-border text-txt text-sm hover:border-golddim hover:text-gold transition">
    Yana yuklash
  </button> 
</main>

<div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4">
  <div class="relative w-full max-w-3xl">
    <button id="closeModalBtn" class="absolute -top-10 right-0 text-txt text-sm border border-border rounded-lg px-3 py-1.5 bg-panel hover:border-golddim hover:text-gold">Yopish ✕</button>
    <div class="w-full aspect-video rounded-xl overflow-hidden bg-panel border border-border">
      <iframe id="videoFrame" class="w-full h-full" src="" title="video" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>
  </div>
</div>

<script src="../js/qidiruv.js"></script>
</body>
</html>
