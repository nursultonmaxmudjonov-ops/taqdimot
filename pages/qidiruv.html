<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAR — Qidiruv</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/zar-app.css">
<script src="../assets/zar-tailwind-config.js"></script>
<style>
  ::placeholder{ color:#5b6472; }
  .card-thumb{ aspect-ratio: 9/16; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
</style>
</head>
<body class="bg-bg text-txt font-sans min-h-screen">

<div class="flex min-h-screen">
  <!-- SIDEBAR (desktop) -->
  <aside class="hidden lg:flex w-64 flex-col justify-between py-8 border-r border-white/5 bg-sidebar fixed inset-y-0 z-40" data-zar-sidebar></aside>

  <!-- MOBILE TOP BAR -->
  <header class="zar-topbar lg:hidden" data-zar-topbar></header>

  <!-- MOBILE BOTTOM TAB BAR -->
  <nav class="zar-tabbar lg:hidden" data-zar-tabbar></nav>

<!-- MAIN -->
<main class="lg:ml-64 flex-1 px-5 md:px-9 py-7 pt-20 lg:pt-7 pb-24 lg:pb-16 min-w-0">
  <div class="mt-10 lg:mt-0">
    <h1 class="text-xl font-bold">Qidiruv</h1>
    <p class="text-txtdim text-sm mt-1">Videolar, foydalanuvchilar va hashtaglar bo'yicha qidiring</p>
  </div>

  <div class="mt-5 flex items-center gap-2.5 bg-panel border border-border rounded-xl px-4 py-3 max-w-xl">
    <svg class="w-[18px] h-[18px] text-txtfaint flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="text" placeholder="Foydalanuvchi, hashtag yoki so'z kiriting..." autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-txt text-sm placeholder:text-txtfaint">
    <button id="clearBtn" class="hidden text-txtfaint text-xs hover:text-txt">Tozalash</button>
    <button id="micBtn" type="button" aria-label="Ovozli qidiruv" class="flex items-center justify-center w-8 h-8 rounded-lg text-txtdim hover:text-gold hover:bg-panel-2 transition flex-shrink-0"><svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 19v3"/></svg></button>
  </div>
  <div id="micStatus" class="hidden mt-2 text-xs text-gold flex items-center gap-2 max-w-xl">
    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
    Tinglanmoqda...
  </div>

  <div id="chipRow" class="mt-4 flex gap-2 flex-wrap"></div>

  <div class="mt-5 flex justify-between items-center text-txtdim text-sm">
    <div><b id="resultCount" class="text-txt font-semibold">0</b> ta natija topildi</div>
  </div>

  <div id="grid" class="mt-3.5 grid gap-4" style="grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));"></div>

  <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-txtdim text-center">
    <h3 class="text-base text-txt mb-1.5 font-semibold">Hech narsa topilmadi</h3>
  </div>

  <button id="loadMoreBtn" class="block mx-auto mt-6 px-7 py-2.5 rounded-lg bg-panel border border-border text-txt text-sm hover:border-golddim hover:text-gold transition">Yana yuklash</button>
</main>
</div>

<div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4">
  <div class="relative w-full max-w-3xl">
    <button id="closeModalBtn" class="absolute -top-10 right-0 text-txt text-sm border border-border rounded-lg px-3 py-1.5 bg-panel hover:border-golddim hover:text-gold">Yopish ✕</button>
    <div class="w-full aspect-video rounded-xl overflow-hidden bg-panel border border-border">
      <iframe id="videoFrame" class="w-full h-full" src="" title="video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script src="../assets/zar-app.js"></script>
<script>ZarNav.mount({ active: 'qidiruv', title: 'Qidiruv' });</script>
<script>
  // JS KODI
  const USERNAMES = ["Bek_vines","dilnoza.travel","Ozodbek_official","Sardor_life","Kamola_beauty","Jasur_sport","Nigora_cook","Aziz_moto","Malika_dance","Shaxzod_gym","Feruza_style","Otabek_music","Sevinch_art","Diyor_travel","Gulnoza_fit","Bahrom_food","Zarina_makeup","Umid_football","Madina_vlog","Sherzod_car"];
  const HASHTAGS = ["seriya","izlanish","tabiat","sport","kulgu","sayohat","oshxona","futbol","raqs","fitness","moda","musiqa","avto","gozallik","kundalik","yangilik","trend","viral","dostlik","motivatsiya"];
  const CATEGORIES = ["Barchasi","Trend","Yangi","Sport","Sayohat","Oshxona","Moda","Kulgu","Musiqa"];
  const VIDEO_IDS = ["dQw4w9WgXcQ", "jNQXAC9IVRw", "kJQP7kiw5Fk", "9bZkp7q19f0"];

  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function fmt(n){
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(".0","") + "M";
    if(n >= 1000) return (n/1000).toFixed(1).replace(".0","") + "K";
    return n;
  }

  const items = Array.from({length: 1000}, (_, i) => ({
    id: i,
    user: USERNAMES[rand(0, USERNAMES.length-1)] + (Math.random() > 0.5 ? "" : rand(1,99)),
    tag: HASHTAGS[rand(0, HASHTAGS.length-1)],
    category: CATEGORIES[rand(1, CATEGORIES.length-1)],
    likes: rand(120, 890000),
    comments: rand(3, 12000),
    live: Math.random() < 0.06,
    seed: i,
    vidId: VIDEO_IDS[rand(0, VIDEO_IDS.length-1)]
  }));

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const resultCount = document.getElementById('resultCount');
  const emptyState = document.getElementById('emptyState');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const chipRow = document.getElementById('chipRow');
  const videoModal = document.getElementById('videoModal');
  const videoFrame = document.getElementById('videoFrame');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const micBtn = document.getElementById('micBtn');
  const micStatus = document.getElementById('micStatus');

  let activeCategory = "Barchasi";
  let query = "";
  let visibleCount = 60;
  const PAGE = 60;

  // --- Ovoz orqali qidiruv (mavjud bo'lsa) ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = "uz-UZ";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => { micStatus.classList.remove('hidden'); };
    recognition.onend = () => { micStatus.classList.add('hidden'); };
    recognition.onerror = () => { micStatus.classList.add('hidden'); };
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      searchInput.value = transcript;
      query = transcript;
      visibleCount = PAGE;
      render();
    };

    micBtn.addEventListener('click', () => {
      try { recognition.start(); } catch (err) { /* allaqachon ishga tushgan */ }
    });
  } else {
    micBtn.classList.add('hidden');
  }

  // --- Kartochkani ochish ---
  function openModal(vidId) {
    videoFrame.src = `https://www.youtube.com/embed/${vidId}?autoplay=1`;
    videoModal.classList.remove('hidden');
    videoModal.classList.add('flex');
  }
  function closeModal() {
    videoFrame.src = "";
    videoModal.classList.add('hidden');
    videoModal.classList.remove('flex');
  }
  closeModalBtn.addEventListener('click', closeModal);
  videoModal.addEventListener('click', (e) => { if (e.target === videoModal) closeModal(); });

  // --- Render / filtrlash ---
  function render() {
    const filtered = items.filter(it => {
      const matchesCat = activeCategory === "Barchasi" || it.category === activeCategory;
      const q = query.toLowerCase().trim();
      const matchesQuery = !q || it.user.toLowerCase().includes(q) || it.tag.toLowerCase().includes(q);
      return matchesCat && matchesQuery;
    });

    resultCount.textContent = filtered.length;
    grid.innerHTML = filtered.slice(0, visibleCount).map(it => `
      <div onclick="openModal('${it.vidId}')" role="button" tabindex="0" aria-label="${it.user} videosi" class="card-thumb relative rounded-xl overflow-hidden bg-card border border-border cursor-pointer hover:-translate-y-0.5 hover:border-golddim transition">
        <img src="https://picsum.photos/seed/zar${it.seed}/300/500" loading="lazy" class="w-full h-full object-cover">
        <div class="absolute top-2 left-2 ${it.live ? 'bg-red-500' : 'hidden'} text-[10px] font-bold px-1.5 py-0.5 rounded text-white">JONLI</div>
        <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/90 to-transparent">
          <div class="text-xs font-semibold truncate">${it.user}</div>
          <div class="text-[10px] text-txtdim">#${it.tag} • ${fmt(it.likes)} layk</div>
        </div>
      </div>`).join('');

    emptyState.classList.toggle('hidden', filtered.length !== 0);
    grid.classList.toggle('hidden', filtered.length === 0);
    loadMoreBtn.classList.toggle('hidden', visibleCount >= filtered.length);
    clearBtn.classList.toggle('hidden', query === "");
  }

  CATEGORIES.forEach(cat => {
    const div = document.createElement('div');
    div.className = "px-3.5 py-1.5 rounded-full border cursor-pointer text-sm transition" + (cat === activeCategory ? " bg-gold/10 border-golddim text-gold" : " border-border text-txtdim");
    div.textContent = cat;
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');
    div.onclick = () => {
      activeCategory = cat;
      document.querySelectorAll('#chipRow div').forEach(c => {
        const isActive = c.textContent === cat;
        c.classList.toggle('bg-gold/10', isActive);
        c.classList.toggle('border-golddim', isActive);
        c.classList.toggle('text-gold', isActive);
        c.classList.toggle('border-border', !isActive);
        c.classList.toggle('text-txtdim', !isActive);
      });
      visibleCount = PAGE;
      render();
    };
    chipRow.appendChild(div);
  });

  searchInput.addEventListener('input', (e) => { query = e.target.value; visibleCount = PAGE; render(); });
  clearBtn.addEventListener('click', () => { searchInput.value = ""; query = ""; render(); });
  loadMoreBtn.addEventListener('click', () => { visibleCount += PAGE; render(); });

  render();
</script>
</body>
</html>
