<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAR — Qidiruv</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0a0d12',
          sidebar: '#0d1119',
          panel: '#12161f',
          card: '#141a24',
          border: '#232936',
          gold: '#e8b64a',
          golddim: '#a9812f',
          txt: '#eef0f3',
          txtdim: '#8b93a1',
          txtfaint: '#5b6472'
        }
      }
    }
  }
</script>
<style>
  ::placeholder{ color:#5b6472; }
  .card-thumb{ aspect-ratio: 9/16; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
</style>
</head>
<body class="bg-bg text-txt font-sans min-h-screen flex flex-col md:flex-row">

<!-- SIDBAR (Faqat desktopda ko'rinadi) -->
<aside class="hidden md:flex w-[260px] min-w-[260px] bg-sidebar border-r border-border flex-col p-7 sticky top-0 h-screen">
  <div>
    <div class="text-2xl font-extrabold tracking-[4px] text-gold" style="font-family:Georgia, serif">ZAR</div>
    <div class="text-[10px] tracking-[2px] text-txtfaint uppercase mt-1">Private member</div>
  </div>

  <nav class="mt-9 flex flex-col gap-1">
    <a href="../index.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-txtdim text-sm hover:bg-[#151b26] hover:text-txt transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Asosiy
    </a>
    <a href="./qidiruv.html" class="relative flex items-center gap-3 px-3.5 py-2.5 rounded-lg bg-[#171d29] text-gold text-sm font-semibold">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Qidiruv
      <span class="absolute -right-7 top-0 bottom-0 w-[3px] bg-gold rounded"></span>
    </a>
  </nav>

  <div class="flex-1"></div>

  <div class="bg-panel border border-border rounded-xl p-4">
    <div class="text-xs text-txtdim mb-1.5">Hisobingiz</div>
    <div id="balanceDisplay" class="text-xl font-bold">12 480 <span class="text-sm font-normal text-txtdim">ball</span></div>
  </div>
</aside>

<!-- MOBIL PASTI MENYU (Faqat mobil qurilmalarda ko'rinadi) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-sidebar border-t border-border flex justify-around p-3 z-40">
  <a href="../index.html" class="text-txtdim flex flex-col items-center text-[10px]"><svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg> Asosiy</a>
  <a href="./qidiruv.html" class="text-gold flex flex-col items-center text-[10px]"><svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> Qidiruv</a>
</nav>

<main class="flex-1 px-4 md:px-9 py-7 pb-24 md:pb-16 min-w-0">
  <div>
    <h1 class="text-xl font-bold">Qidiruv</h1>
    <p class="text-txtdim text-sm mt-1">Videolar, foydalanuvchilar va hashtaglar bo'yicha qidiring</p>
  </div>

  <div class="mt-5 flex items-center gap-2.5 bg-panel border border-border rounded-xl px-4 py-3 w-full max-w-xl">
    <svg class="w-[18px] h-[18px] text-txtfaint flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="text" placeholder="Qidiruv..." class="flex-1 bg-transparent border-none outline-none text-txt text-sm placeholder:text-txtfaint">
    <button id="micBtn" type="button" class="text-txtdim hover:text-gold transition">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 19v3"/></svg>
    </button>
  </div>

  <div id="chipRow" class="mt-4 flex gap-2 flex-wrap"></div>

  <div id="grid" class="mt-5 grid gap-3 md:gap-4 grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5" style="grid-auto-rows: max-content;"></div>
</main>

<!-- Video Modal o'zgarishsiz -->
<div id="videoModal" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4">
  <div class="relative w-full max-w-3xl">
    <button id="closeModalBtn" class="absolute -top-10 right-0 text-txt text-sm border border-border rounded-lg px-3 py-1.5 bg-panel hover:border-golddim hover:text-gold">Yopish ✕</button>
    <div class="w-full aspect-video rounded-xl overflow-hidden bg-panel border border-border">
      <iframe id="videoFrame" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script src="../js/qidiruv.js"></script>
</body>
</html>
