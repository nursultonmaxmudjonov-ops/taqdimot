    <!-- Navigation -->

        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Qidiruv
      </a>
      <a href="./hamyon.html" class="flex items-center gap-4 px-4 py-3 text-white/50 hover:text-white transition rounded-xl">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Reytinglar

      <!-- ACTIVE ITEM (bu sahifa — Bildirishnoma) -->
      <a href="./bildirishnomalar.html" class="flex items-center gap-4 px-4 py-3 text-[#f0b34a] active-nav rounded-xl relative">
        <div class="absolute right-0 top-2 bottom-2 w-1 bg-[#f0b34a] rounded-l-full"></div>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>

    <!-- Footer Card -->
    <div class="px-6">
      <div class="bg-[#1a1826] rounded-2xl p-5 border border-white/5">
        <p class="text-white/40 text-[12px] mb-1">Hisobingiz</p>
        <p class="text-2xl font-bold">12 480 <span class="text-[#f0b34a] text-sm font-normal">ball</span></p>
      </div>
    </div>
  </aside>

  <!-- MOBILE TOP BAR (sidebar lg:hidden bo'lgani uchun) -->
  <header class="lg:hidden fixed top-0 inset-x-0 z-50 flex items-center justify-between px-4 h-14 bg-[#0c0b14]/95 backdrop-blur border-b border-white/5">
    <a href="../index.html" class="p-2 -ml-2 text-white/60 hover:text-white transition" aria-label="Orqaga">

    </a>
    <span class="font-semibold text-[15px]">Bildirishnomalar</span>
    <span class="w-9"></span>
  </header>

  <!-- Main Content -->
  <main class="lg:ml-64 flex-1 p-8 pt-20 lg:pt-8">
    <header class="hidden lg:flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold">Bildirishnomalar</h1>
      </div>
      <button id="markAllBtn" onclick="markAllRead()" class="hidden sm:block text-[13px] font-medium text-[#f0b34a] hover:text-white transition">Barchasini o'qilgan deb belgilash</button>
    </header>

    <div class="flex lg:hidden justify-end mb-4">
      <button onclick="markAllRead()" class="text-[13px] font-medium text-[#f0b34a] hover:text-white transition">Barchasini o'qilgan deb belgilash</button>
    </div>

    <div id="groups" class="space-y-3"></div>
  </main>
</div>

<script>
const notifications = Array.from({ length: 30 }, (_, i) => ({
    id: i + 1, title: 'Yangi bildirishnoma #' + (i + 1), text: 'Bu yerda xabar matni joylashgan...', unread: i < 5
}));
let data = [...notifications];

function render() {
  document.getElementById('groups').innerHTML = data.map(n => `
    <div class="card-enter flex gap-3 p-4 rounded-2xl border ${n.unread ? 'border-[#f0b34a]/20 bg-[#f0b34a]/5' : 'border-white/5 bg-white/[0.02]'} cursor-pointer" onclick="toggleRead(${n.id})">
      <div class="flex-1">
        <p class="font-semibold ${n.unread ? 'text-white' : 'text-white/60'}">${n.title}</p>
        <p class="text-sm text-white/40">${n.text}</p>
      </div>
    </div>`).join('');
}
function toggleRead(id) { data.find(x => x.id === id).unread = false; render(); }
function markAllRead() { data.forEach(n => n.unread = false); render(); }
render();
</script>
</body>
</html>
