<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAR — Bildirishnomalar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/zar-app.css">
<script src="../assets/zar-tailwind-config.js"></script>
<style>
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .card-enter { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="flex min-h-screen">
  <!-- SIDEBAR (desktop) -->
  <aside class="hidden lg:flex w-64 flex-col justify-between py-8 border-r border-white/5 bg-sidebar fixed inset-y-0 z-40" data-zar-sidebar></aside>

  <!-- MOBILE TOP BAR -->
  <header class="zar-topbar lg:hidden" data-zar-topbar></header>

  <!-- MOBILE BOTTOM TAB BAR -->
  <nav class="zar-tabbar lg:hidden" data-zar-tabbar></nav>

  <!-- Main Content -->
  <main class="lg:ml-64 flex-1 p-8 pt-20 pb-24 lg:pb-8 lg:pt-8">
    <header class="hidden lg:flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold">Bildirishnomalar</h1>
      </div>
      <button id="markAllBtn" onclick="markAllRead()" class="hidden sm:block text-[13px] font-medium text-gold hover:text-white transition">Barchasini o'qilgan deb belgilash</button>
    </header>

    <div class="flex lg:hidden justify-end mb-4">
      <button onclick="markAllRead()" class="text-[13px] font-medium text-gold hover:text-white transition">Barchasini o'qilgan deb belgilash</button>
    </div>

    <div id="groups" class="space-y-3"></div>
  </main>
</div>

<script src="../assets/zar-app.js"></script>
<script>ZarNav.mount({ active: 'bildirishnoma', title: 'Bildirishnomalar' });</script>
<script>
// Varied realistic notification templates instead of literal filler text,
// cycled to build 30 entries with believable relative timestamps.
const NOTIF_TEMPLATES = [
  { icon: '🎉', title: "Video uchun mukofot", text: (n) => `Video to'liq ko'rildi — +${n} ball hisobingizga qo'shildi.` },
  { icon: '👥', title: "Referal bonusi", text: () => "Do'stingiz taklifingiz orqali ro'yxatdan o'tdi — 500 ball ishladingiz." },
  { icon: '🎬', title: "Yangi video mavjud", text: () => "Siz kuzatgan mavzuda yangi video qo'shildi, ko'rib ball yig'ing." },
  { icon: '💸', title: "Yechib olish yakunlandi", text: () => "So'mga o'tkazma muvaffaqiyatli amalga oshirildi." },
  { icon: '🏆', title: "Yangi daraja", text: () => "Tabriklaymiz! Siz Oltin darajaga yetdingiz." },
  { icon: '🔔', title: "Kunlik eslatma", text: () => "Bugun hali video ko'rmadingiz — ballaringizni yo'qotmang." }
];
const RELATIVE_TIMES = ["hozir","12 daqiqa oldin","1 soat oldin","3 soat oldin","kecha","2 kun oldin"];

const notifications = Array.from({ length: 30 }, (_, i) => {
  const t = NOTIF_TEMPLATES[i % NOTIF_TEMPLATES.length];
  return {
    id: i + 1,
    icon: t.icon,
    title: t.title,
    text: t.text(10 + (i % 5) * 8),
    time: RELATIVE_TIMES[i % RELATIVE_TIMES.length],
    unread: i < 5
  };
});
let data = [...notifications];

function render() {
  const groupsEl = document.getElementById('groups');
  if (data.length === 0) {
    groupsEl.innerHTML = '<div class="text-center py-16 text-white/40 text-sm">Hozircha bildirishnomalar yo\'q</div>';
    return;
  }
  groupsEl.innerHTML = data.map(n => `
    <div class="card-enter flex gap-3 p-4 rounded-2xl border ${n.unread ? 'border-gold/20 bg-gold/5' : 'border-white/5 bg-white/[0.02]'} cursor-pointer" role="button" tabindex="0" onclick="toggleRead(${n.id})">
      <div class="text-xl leading-none">${n.icon}</div>
      <div class="flex-1">
        <div class="flex items-center justify-between gap-2">
          <p class="font-semibold ${n.unread ? 'text-white' : 'text-white/60'}">${n.title}</p>
          <span class="text-[10px] text-white/30 flex-shrink-0">${n.time}</span>
        </div>
        <p class="text-sm text-white/40">${n.text}</p>
      </div>
    </div>`).join('');
}
function toggleRead(id) { data.find(x => x.id === id).unread = false; render(); }
function markAllRead() { data.forEach(n => n.unread = false); render(); ZarUI.toast("Barchasi o'qilgan deb belgilandi"); }
render();
</script>
</body>
</html>
